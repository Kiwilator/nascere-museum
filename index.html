<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#102c35" />
  <title>NASCERE — Museo virtual</title>
  <link rel="stylesheet" href="./style.css?v=2" />
</head>
<body>
  <div id="loading-screen" aria-live="polite">
    <div class="loading-mark" aria-hidden="true">
      <span></span><span></span><span></span>
    </div>
    <p class="loading-kicker">MUSEO VIRTUAL</p>
    <h1>NASCERE</h1>
    <p id="loading-status">Preparando la exposición</p>
    <div class="loading-track"><i></i></div>
  </div>

  <iframe
    id="museum-frame"
    title="Museo virtual Nascere"
    src="./legacy.html"
    allow="autoplay; fullscreen; xr-spatial-tracking"
  ></iframe>

  <div id="museum-ui">
    <header class="topbar">
      <button id="brand-button" class="brand" type="button" aria-label="Información sobre Nascere">
        <span class="brand-name">NASCERE</span>
        <span class="brand-subtitle" data-i18n="museum">MUSEO VIRTUAL</span>
      </button>

      <div class="top-actions">
        <div class="language-switcher" role="group" aria-label="Idioma">
          <button type="button" data-language="es" aria-pressed="true">ES</button>
          <span>/</span>
          <button type="button" data-language="en" aria-pressed="false">EN</button>
        </div>
        <button id="sound-toggle" class="utility-button" type="button" aria-pressed="false">
          <span class="status-dot"></span><span data-i18n="sound">SONIDO</span>
        </button>
        <button id="reset-view" class="utility-button" type="button" data-i18n="reset">INICIO</button>
      </div>
    </header>

    <div id="intro-card">
      <span class="intro-index">01 — 04</span>
      <p data-i18n="intro">Recorre el espacio y selecciona los puntos de la exposición para descubrir el proyecto.</p>
      <div class="intro-controls">
        <span class="desktop-only"><b>WASD</b> <em data-i18n="move">Mover</em></span>
        <span class="desktop-only"><b>ARRASTRAR</b> <em data-i18n="look">Mirar</em></span>
        <span class="mobile-only"><b>JOYSTICK</b> <em data-i18n="move">Mover</em></span>
        <span class="mobile-only"><b>DESLIZAR</b> <em data-i18n="look">Mirar</em></span>
      </div>
    </div>

    <div id="exhibit-hint" aria-hidden="true">
      <span class="hint-pulse"></span>
      <span data-i18n="selectPoint">Selecciona un punto</span>
    </div>

    <aside id="exhibit-panel" role="dialog" aria-modal="false" aria-hidden="true">
      <button class="panel-close" type="button" aria-label="Cerrar">×</button>
      <div class="panel-header">
        <span id="panel-index">01</span>
        <span id="panel-category">NASCERE</span>
      </div>
      <div class="panel-content">
        <p id="panel-eyebrow"></p>
        <h2 id="panel-title"></h2>
        <p id="panel-lead"></p>
        <div id="panel-body"></div>
      </div>
      <div class="panel-footer">
        <span data-i18n="explore">EXPLORA LA EXPOSICIÓN</span>
        <span id="panel-progress">01 / 04</span>
      </div>
    </aside>

    <div id="mobile-controls" aria-label="Control de movimiento">
      <div id="joystick-base"><div id="joystick-nub"></div></div>
    </div>
  </div>

  <script src="./script.js?v=2"></script>
</body>
</html>
