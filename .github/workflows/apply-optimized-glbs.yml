name: Apply optimized GLBs

on:
  push:
    branches:
      - optimize-3d-assets

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message != 'Apply optimized GLB assets'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install glTF Transform
        run: npm install --global @gltf-transform/cli

      - name: Optimize and replace assets
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p tmp

          optimize_model() {
            input="$1"
            output="$2"
            ratio="$3"
            error="$4"
            stem=$(basename "$output" .glb)
            gltf-transform dedup "$input" "tmp/${stem}_1.glb"
            gltf-transform prune "tmp/${stem}_1.glb" "tmp/${stem}_2.glb"
            gltf-transform weld "tmp/${stem}_2.glb" "tmp/${stem}_3.glb"
            gltf-transform simplify "tmp/${stem}_3.glb" "tmp/${stem}_4.glb" --ratio "$ratio" --error "$error"
            gltf-transform resize "tmp/${stem}_4.glb" "$output" --width 1024 --height 1024
          }

          optimize_model "assets/bendy_bench_game_ready.glb" "assets/bendy_bench_game_ready.glb" 0.45 0.002
          optimize_model "assets/office_chair_modern.glb" "assets/office_chair_modern.glb" 0.45 0.002
          optimize_model "assets/sea_lion_statue_marina_san_francisco_1.glb" "assets/sea_lion_statue_marina_san_francisco_1.glb" 0.60 0.001

          gltf-transform inspect assets/bendy_bench_game_ready.glb >/dev/null
          gltf-transform inspect assets/office_chair_modern.glb >/dev/null
          gltf-transform inspect assets/sea_lion_statue_marina_san_francisco_1.glb >/dev/null

      - name: Commit optimized assets
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/bendy_bench_game_ready.glb assets/office_chair_modern.glb assets/sea_lion_statue_marina_san_francisco_1.glb
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Apply optimized GLB assets"
            git push
          fi
