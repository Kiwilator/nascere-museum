name: Apply onboarding screen

on:
  push:
    branches:
      - nascere-v2-onboarding
    paths:
      - '.github/workflows/apply-onboarding.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install final onboarding component
        run: python .github/scripts/install_final_onboarding.py

      - name: Verify patch
        run: |
          grep -q './controls-onboarding-final.js?v=1' index.html
          test -f controls-onboarding-final.js
          grep -q 'CÓMO MOVERTE' controls-onboarding-final.js
          grep -q 'WASD O FLECHAS' controls-onboarding-final.js
          grep -q 'CLIC + ARRASTRAR' controls-onboarding-final.js
          grep -q 'hover: none' controls-onboarding-final.js

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Install isolated final controls onboarding'
          git push
