name: Apply onboarding screen

on:
  push:
    branches:
      - nascere-v2-onboarding
    paths:
      - '.github/workflows/apply-onboarding.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply final bacteria-style layout
        run: python .github/scripts/fix_onboarding_like_bacteria.py

      - name: Verify patch
        run: |
          grep -q 'WASD O FLECHAS' index.html
          grep -q 'CLIC + ARRASTRAR' index.html
          grep -q 'Usa WASD o las flechas del teclado' index.html
          grep -q 'FINAL bacteria-layout onboarding override' style.css
          grep -q './style.css?v=7' index.html

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html style.css
          git commit -m 'Match onboarding layout to bacteria museum'
          git push
