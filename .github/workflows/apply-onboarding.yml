name: Apply onboarding screen

on:
  push:
    branches:
      - nascere-v2-onboarding
    paths:
      - '.github/workflows/apply-onboarding.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore full controls with icons
        run: python .github/scripts/restore_onboarding_controls.py

      - name: Verify patch
        run: |
          grep -q 'WASD + FLECHAS' index.html
          grep -q 'mouse-icon' index.html
          grep -q 'ARRASTRAR' index.html

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Restore movement and look controls with keyboard and mouse icons'
          git push
