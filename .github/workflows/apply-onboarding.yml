name: Apply onboarding screen

on:
  push:
    branches:
      - nascere-v2-onboarding
    paths:
      - '.github/workflows/apply-onboarding.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply patch
        run: python .github/scripts/apply_onboarding.py

      - name: Verify patch
        run: |
          grep -q 'id="enter-museum"' index.html
          grep -q 'ui-ready' style.css
          grep -q 'enterButton' script.js

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html style.css script.js
          git commit -m 'Add onboarding instructions and stabilize UI font loading'
          git push
