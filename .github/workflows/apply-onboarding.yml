name: Apply onboarding screen

on:
  push:
    branches:
      - nascere-v2-onboarding
    paths:
      - '.github/workflows/apply-onboarding.yml'

jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Simplify controls
        run: python .github/scripts/simplify_controls.py

      - name: Verify patch
        run: |
          grep -q 'W A S D' index.html
          grep -q '← ↑ ↓ →' index.html
          if grep -q '<b>ARRASTRAR</b>' index.html; then exit 1; fi

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Simplify onboarding movement controls'
          git push
